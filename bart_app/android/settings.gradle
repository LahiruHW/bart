pluginManagement {
    def flutterSdkPath = {
        def properties = new Properties()
        file("local.properties").withInputStream { properties.load(it) }
        def flutterSdkPath = properties.getProperty("flutter.sdk")
        assert flutterSdkPath != null, "flutter.sdk not set in local.properties"
        return flutterSdkPath
    }
    settings.ext.flutterSdkPath = flutterSdkPath()

    includeBuild("${settings.ext.flutterSdkPath}/packages/flutter_tools/gradle")

    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

plugins {
    id "dev.flutter.flutter-plugin-loader" version "1.0.0"
    id "com.android.application" version '8.9.1' apply false
    // 2.2.20 is what Flutter 3.41.6 generates for a new project and the newest
    // version it claims support for. Raised from 2.1.10, which could not read
    // the Kotlin metadata shipped by firebase_auth 6.x and failed the build at
    // :firebase_auth:compileDebugKotlin.
    id "org.jetbrains.kotlin.android" version "2.2.20" apply false
}

include ":app"
