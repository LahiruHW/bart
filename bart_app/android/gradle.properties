org.gradle.jvmargs=-Xmx4G
android.useAndroidX=true
android.enableJetifier=true
android.defaults.buildfeatures.buildconfig=true
android.nonTransitiveRClass=false
android.nonFinalResIds=false
# NOTE: do not add `org.gradle.java.home` here. This file is tracked in git, so
# an absolute JDK path breaks every machine except the one it was written on —
# including Linux CI, where a Windows path is meaningless. Gradle picks up the
# JDK from JAVA_HOME (which `flutter build` sets from its own JDK detection, and
# which CI sets via actions/setup-java).
#
# If you need to pin a JDK for yourself, put it in your *untracked* per-user
# file instead, which overrides this one:
#   ~/.gradle/gradle.properties      (Windows: %USERPROFILE%\.gradle\gradle.properties)
# and remember that backslashes must be escaped there:
#   org.gradle.java.home=C:\\Program Files\\Java\\jdk-21
#
# Or point Flutter at it, which needs no escaping:
#   flutter config --jdk-dir="C:\Program Files\Java\jdk-21"
